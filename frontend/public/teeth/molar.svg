<svg viewBox="0 0 100 100">
  <defs>
    <!-- Enamel Gradients for tooth surface -->
    <linearGradient id="enamelBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(40, 30%, 95%)" />
      <stop offset="50%" stop-color="hsl(40, 25%, 85%)" />
      <stop offset="100%" stop-color="hsl(40, 20%, 75%)" />
    </linearGradient>
    <!-- Radial gradient for cusp highlights -->
    <radialGradient id="cuspHighlight" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="hsl(40, 40%, 100%, 0.8)" />
      <stop offset="100%" stop-color="hsl(40, 30%, 90%, 0)" />
    </radialGradient>
    <!-- Radial gradient for fossa depth -->
    <radialGradient id="fossaDepth" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="hsl(40, 20%, 60%)" />
      <stop offset="100%" stop-color="hsl(40, 25%, 80%)" />
    </radialGradient>
    <!-- Linear gradient for grooves -->
    <linearGradient id="grooveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(40, 15%, 50%)" />
      <stop offset="100%" stop-color="hsl(40, 10%, 40%)" />
    </linearGradient>
    <!-- Linear gradient for gum tissue -->
    <linearGradient id="gumGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="hsl(340, 60%, 75%)" />
      <stop offset="50%" stop-color="hsl(340, 55%, 65%)" />
      <stop offset="100%" stop-color="hsl(340, 60%, 75%)" />
    </linearGradient>
    <!-- Filter for subtle shadow beneath the tooth -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset in="blur" dx="1" dy="1" result="offsetBlur"/>
      <feFlood flood-color="hsl(40, 10%, 20%, 0.3)" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Gum Collar - slightly larger and offset from the tooth base to create depth -->
  <path d="M 40 28 C 45 23 60 28 65 33 C 70 48 65 65 60 73 C 55 78 40 73 30 68 C 25 53 30 38 40 28 Z" fill="url(#gumGradient)" />

  <!-- Tooth Crown Base Shape - Anatomically correct rhomboidal outline for an upper first molar -->
  <path d="M 40 30 C 45 25, 60 30, 65 35 C 70 50, 68 60, 60 70 C 55 75, 45 75, 35 65 C 30 55, 30 40, 40 30 Z" fill="url(#enamelBase)" filter="url(#shadow)" />

  <!-- Main Cusps (represented by subtle highlights using radial gradients) -->
  <!-- Mesiolingual (ML) cusp - largest and most prominent -->
  <circle cx="35" cy="65" r="8" fill="url(#cuspHighlight)" opacity="0.7"/>
  <!-- Mesiobuccal (MB) cusp -->
  <circle cx="42" cy="32" r="7" fill="url(#cuspHighlight)" opacity="0.7"/>
  <!-- Distobuccal (DB) cusp -->
  <circle cx="63" cy="37" r="6" fill="url(#cuspHighlight)" opacity="0.7"/>
  <!-- Distolingual (DL) cusp - smallest -->
  <circle cx="58" cy="68" r="5" fill="url(#cuspHighlight)" opacity="0.7"/>
  <!-- Cusp of Carabelli - located on the mesiolingual surface of the ML cusp -->
  <circle cx="30" cy="70" r="4" fill="url(#cuspHighlight)" opacity="0.7"/>

  <!-- Central Fossa - the main depression in the center of the occlusal surface -->
  <circle cx="50" cy="50" r="5" fill="url(#fossaDepth)" opacity="0.8"/>

  <!-- Grooves and Ridges (using paths with grooveGradient for depth) -->
  <!-- Central Developmental Groove (runs mesiodistally through the central fossa) -->
  <path d="M 45 48 C 48 49 52 49 55 48" stroke="url(#grooveGradient)" stroke-width="1.5" fill="none" />

  <!-- Buccal Developmental Groove - extends buccally, separating MB and DB cusps -->
  <path d="M 48 48 C 45 43 42 38 40 35" stroke="url(#grooveGradient)" stroke-width="1.5" fill="none" />
  <!-- Lingual Developmental Groove - extends lingually, separating ML and DL cusps -->
  <path d="M 52 48 C 55 53 58 58 60 62" stroke="url(#grooveGradient)" stroke-width="1.5" fill="none" />

  <!-- Oblique Ridge - connects the ML cusp to the DB cusp, defined by surrounding grooves -->
  <!-- Groove mesial to the oblique ridge (separates ML from MB) -->
  <path d="M 37 60 C 40 55 45 50 48 48" stroke="url(#grooveGradient)" stroke-width="1.2" fill="none" />
  <!-- Groove distal to the oblique ridge (separates DB from DL) -->
  <path d="M 60 45 C 55 50 52 55 55 60" stroke="url(#grooveGradient)" stroke-width="1.2" fill="none" />

  <!-- Mesial Marginal Ridge Groove (defines the mesial triangular fossa) -->
  <path d="M 38 38 C 35 45 35 55 38 62" stroke="url(#grooveGradient)" stroke-width="1" fill="none" opacity="0.8"/>
  <!-- Distal Marginal Ridge Groove (defines the distal triangular fossa) -->
  <path d="M 62 42 C 65 50 65 60 62 68" stroke="url(#grooveGradient)" stroke-width="1" fill="none" opacity="0.8"/>

  <!-- Supplemental Grooves - smaller, irregular grooves radiating from fossae and main grooves -->
  <path d="M 47 48 L 45 46" stroke="url(#grooveGradient)" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M 53 48 L 55 46" stroke="url(#grooveGradient)" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M 48 50 L 45 52" stroke="url(#grooveGradient)" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M 52 50 L 55 52" stroke="url(#grooveGradient)" stroke-width="0.8" fill="none" opacity="0.7"/>

  <!-- Triangular Ridges - represented by subtle groove patterns leading to cusp tips -->
  <!-- MB cusp triangular ridge -->
  <path d="M 42 32 L 47 45" stroke="url(#grooveGradient)" stroke-width="0.8" fill="none" opacity="0.7"/>
  <!-- DB cusp triangular ridge -->
  <path d="M 63 37 L 53 45" stroke="url(#grooveGradient)" stroke-width="0.8" fill="none" opacity="0.7"/>
  <!-- ML cusp triangular ridge -->
  <path d="M 35 65 L 47 55" stroke="url(#grooveGradient)" stroke-width="0.8" fill="none" opacity="0.7"/>
  <!-- DL cusp triangular ridge -->
  <path d="M 58 68 L 53 55" stroke="url(#grooveGradient)" stroke-width="0.8" fill="none" opacity="0.7"/>

  <!-- Carabelli groove/pit - associated with the Cusp of Carabelli -->
  <path d="M 30 70 L 32 68" stroke="url(#grooveGradient)" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M 30 70 L 28 72" stroke="url(#grooveGradient)" stroke-width="0.8" fill="none" opacity="0.7"/>
</svg>